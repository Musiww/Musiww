<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Rongwei's little dev garden</title><desc id="desc">A cream and sage banner with a laptop, a small cat, coffee, plants and mountains. Code with care. Grow with curiosity.</desc>
<rect width="1200" height="340" rx="24" fill="#f7f5ee"/>
<path d="M0 293 Q200 260 360 302 T720 293 T1200 280 V340 H0Z" fill="#e7eddf"/>
<g fill="#b3c4a3" opacity=".25"><circle cx="1110" cy="70" r="111"/><circle cx="800" cy="292" r="90"/></g>
<g font-family="DejaVu Sans, sans-serif" fill="#344c3b">
<text x="55" y="67" font-size="14" letter-spacing="3">MUSIWW / A LITTLE CORNER OF THE INTERNET</text>
<text x="52" y="136" font-size="48" font-weight="bold">Hi, I'm Rongwei.</text>
<text x="55" y="180" font-size="23" fill="#657c62">Welcome to my little dev garden.</text>
<text x="55" y="232" font-size="18" fill="#626760">Backend logic, thoughtful interfaces,</text>
<text x="55" y="260" font-size="18" fill="#626760">and small things that make learning easier.</text>
<text x="55" y="312" font-size="13" letter-spacing="1.5">CODE WITH CARE. GROW WITH CURIOSITY.</text>
</g>
<!-- tiny mountain postcard -->
